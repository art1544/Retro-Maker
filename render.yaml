# Deploy do RetroMaker no Render (https://render.com)
# Um único Web Service serve API + WebSocket + o client já buildado.
services:
  - type: web
    name: retromaker
    runtime: node
    plan: free # troque para "starter" (pago) se quiser disco persistente
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      # RECOMENDADO: Gemini (temas muito melhores via structured output).
      # Defina AI_PROVIDER=gemini e cadastre a chave como secret no painel do Render.
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false # <- cole a chave no painel do Render (Environment), não aqui
      # Alternativa grátis sem chave: troque AI_PROVIDER para "pollinations".

    # ------------------------------------------------------------------
    # DISCO PERSISTENTE (opcional, requer plano pago).
    # No plano free o histórico (server/data/boards.json) é apagado a cada
    # deploy/reinício. Para manter os boards salvos entre deploys, use um
    # plano pago e descomente o bloco abaixo:
    # disk:
    #   name: retromaker-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
